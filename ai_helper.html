<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy AI Chat - healfood for you</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans Thai", "Kanit", sans-serif;
            background: linear-gradient(135deg, #eef3ff, #f7fbff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .menu { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .menu a { text-decoration: none; color: #4a6cff; font-weight: 500; margin-right: 15px; }

        .chat-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .bot-welcome {
            background: #e9ffe9;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .instruction { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="menu">
    <a href="index.html">🏠 กลับไปหน้าหลัก</a>
</div>

<div class="chat-container">
    <div class="bot-welcome">
        <h3>🍎 สวัสดีคุณ <span id="user-name">ผู้ใช้งาน</span>!</h3>
        <p>ฉันคือ <b>Healthy Food Bot</b> ยินดีที่ได้รู้จักค่ะ<br>
        ฉันสามารถช่วยแนะนำเมนูอาหารและโภชนาการให้คุณได้</p>
    </div>
    <p class="instruction">👉 <b>คลิกที่ปุ่มแชทมุมขวาล่าง</b> เพื่อเริ่มปรึกษาได้เลยค่ะ</p>
</div>

<script src="https://cdn.botpress.cloud/webchat/v2.2/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/01/20/18/20260120183108-IJXWM2NQ.json"></script>

<script>
    // สคริปต์เปิดแชทอัตโนมัติเมื่อพร้อม
    window.botpress.on('ready', function() {
        window.botpress.open();
    });

    // (เพิ่มเติม) ถ้าคุณมีระบบ Login และเก็บชื่อไว้ใน LocalStorage สามารถดึงมาโชว์ได้
    const savedName = localStorage.getItem('username');
    if (savedName) {
        document.getElementById('user-name').innerText = savedName;
    }
</script>

</body>
</html>
